
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Monitoring</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #182230;
    }

    header {
      background: #142b4a;
      color: white;
      padding: 24px;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #d4dfed; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .card, .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000a;
    }

    .card h3 {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }

    .card strong {
      display: block;
      font-size: 30px;
      margin-top: 12px;
    }

    .green { color: #16a34a; }
    .orange { color: #d97706; }
    .red { color: #dc2626; }

    .panel { margin-bottom: 20px; }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      min-width: 230px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    .table-wrap {
      overflow-x: auto;
    }

    #message {
      color: #64748b;
      font-size: 13px;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      main { padding: 14px; }
      header { padding: 20px 14px; }
    }
  </style>
</head>

<body>

<header>
  <h1>Dashboard Monitoring</h1>
  <p>Monitoring data operasional secara otomatis</p>
</header>

<main>

  <section class="cards">
    <div class="card">
      <h3>Total Data</h3>
      <strong id="total">0</strong>
    </div>

    <div class="card">
      <h3>Selesai</h3>
      <strong class="green" id="selesai">0</strong>
    </div>

    <div class="card">
      <h3>Proses</h3>
      <strong class="orange" id="proses">0</strong>
    </div>

    <div class="card">
      <h3>Belum</h3>
      <strong class="red" id="belum">0</strong>
    </div>
  </section>

  <section class="panel">
    <h3>Rekap Status Pekerjaan</h3>
    <div style="max-width:650px; margin:auto;">
      <canvas id="statusChart"></canvas>
    </div>
  </section>

  <section class="panel">
    <h3>Jumlah Data per ULP</h3>
    <div style="height:300px;">
      <canvas id="ulpChart"></canvas>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h3>Data Monitoring</h3>
      <div>
        <input id="search" placeholder="Cari ULP atau penyulang...">
        <button onclick="loadData()">Refresh</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>ULP</th>
            <th>Penyulang</th>
            <th>Jenis Gangguan</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="dataBody"></tbody>
      </table>
    </div>

    <p id="message">Menunggu data...</p>
    <p id="updated">Belum diperbarui</p>
  </section>

</main>

<script>
  // GANTI DENGAN URL CSV GOOGLE SHEETS KAMU
  const CSV_URL = "MASUKKAN_URL_CSV_DI_SINI";

  // Update dashboard setiap 60 detik
  const REFRESH_MS = 60000;

  let allRows = [];
  let statusChart = null;
  let ulpChart = null;

  function clean(value) {
    return String(value ?? "").trim();
  }

  function escapeHTML(value) {
    return clean(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function statusGroup(value) {
    const status = clean(value).toLowerCase();

    if (status === "selesai") return "Selesai";
    if (status.includes("proses")) return "Proses";
    if (status.includes("belum") || status === "pending") {
      return "Belum";
    }

    return "Belum";
  }

  async function loadData() {
    const message = document.getElementById("message");

    if (CSV_URL.includes("MASUKKAN_URL")) {
      message.textContent = "Masukkan URL CSV terlebih dahulu.";
      return;
    }

    message.textContent = "Mengambil data terbaru...";

    try {
      const url = new URL(CSV_URL);
      url.searchParams.set("_refresh", Date.now());

      const response = await fetch(url.toString(), {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const csv = await response.text();

      const result = Papa.parse(csv, {
        header: true,
        skipEmptyLines: true
      });

      if (result.errors.length > 0) {
        console.warn(result.errors);
      }

      allRows = result.data.filter(row =>
        Object.values(row).some(value => clean(value) !== "")
      );

      renderDashboard();

      document.getElementById("updated").textContent =
        "Terakhir diperbarui: " +
        new Date().toLocaleString("id-ID");

      message.textContent =
        "Data berhasil dimuat: " + allRows.length + " baris.";

    } catch (error) {
      message.textContent =
        "Gagal mengambil data: " + error.message;

      console.error(error);
    }
  }

  function renderDashboard() {
    const selesai = allRows.filter(
      row => statusGroup(row.Status) === "Selesai"
    ).length;

    const proses = allRows.filter(
      row => statusGroup(row.Status) === "Proses"
    ).length;

    const belum = allRows.filter(
      row => statusGroup(row.Status) === "Belum"
    ).length;

    document.getElementById("total").textContent = allRows.length;
    document.getElementById("selesai").textContent = selesai;
    document.getElementById("proses").textContent = proses;
    document.getElementById("belum").textContent = belum;

    updateCharts(selesai, proses, belum);
    renderTable(allRows);
  }

  function updateCharts(selesai, proses, belum) {
    const statusData = [selesai, proses, belum];

    if (statusChart) {
      statusChart.data.datasets[0].data = statusData;
      statusChart.update();
    } else {
      statusChart = new Chart(
        document.getElementById("statusChart"),
        {
          type: "doughnut",
          data: {
            labels: ["Selesai", "Proses", "Belum"],
            datasets: [{
              data: statusData,
              backgroundColor: [
                "#16a34a", "#e6a23c", "#dc2626"
              ]
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true
          }
        }
      );
    }

    const counts = {};

    allRows.forEach(row => {
      const ulp = clean(row.ULP) || "Tidak diketahui";
      counts[ulp] = (counts[ulp] || 0) + 1;
    });

    const labels = Object.keys(counts);
    const values = Object.values(counts);

    if (ulpChart) {
      ulpChart.data.labels = labels;
      ulpChart.data.datasets[0].data = values;
      ulpChart.update();
    } else {
      ulpChart = new Chart(
        document.getElementById("ulpChart"),
        {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "Jumlah Data",
              data: values,
              backgroundColor: "#2563eb"
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { precision: 0 }
              }
            }
          }
        }
      );
    }
  }

  function renderTable(rows) {
    const body = document.getElementById("dataBody");

    body.innerHTML = rows.map(row => `
      <tr>
        <td>${escapeHTML(row.Tanggal)}</td>
        <td>${escapeHTML(row.ULP)}</td>
        <td>${escapeHTML(row.Penyulang)}</td>
        <td>${escapeHTML(row["Jenis Gangguan"])}</td>
        <td>${escapeHTML(row.Status)}</td>
      </tr>
    `).join("");
  }

  document.getElementById("search").addEventListener(
    "input", function() {
      const keyword = this.value.toLowerCase();

      const filtered = allRows.filter(row =>
        [
          row.ULP,
          row.Penyulang,
          row["Jenis Gangguan"],
          row.Status
        ].some(value => clean(value).toLowerCase().includes(keyword))
      );

      renderTable(filtered);
    }
  );

  loadData();

  // Ambil data terbaru setiap 60 detik
  setInterval(loadData, REFRESH_MS);
</script>

</body>
</html>
